<!DOCTYPE html>
<html>
<head>
    <title>TradingView Order Bridge</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h2>TradingView Order Bridge</h2>

    <div class="row">
        <div class="field">
            <label>TradingView ID</label>
            <input type="text" id="tradingViewId" placeholder="Enter TradingView ID" />
        </div>

        <div class="field">
            <label>Direction</label>
            <select id="direction">
                <option value="buy">Buy</option>
                <option value="sell">Sell</option>
            </select>
        </div>
    </div>

    <div class="row">
        <div class="field">
            <label>Stop Loss</label>
            <input type="number" id="sl" step="0.00001" />
        </div>

        <div class="field">
            <label>Take Profit</label>
            <input type="number" id="tp" step="0.00001" />
        </div>
    </div>

    <div class="row">
        <div class="field">
            <label>API URL</label>
            <input type="text" id="url" placeholder="https://example.com/api" />
        </div>

        <div class="field">
            <label>Request Type</label>
            <select id="method">
                <option value="POST">POST</option>
                <option value="GET">GET</option>
            </select>
        </div>
    </div>

    <div class="button-row">
        <button id="addTrade">Add New Trade</button>
        <button id="editTrade">Edit Last Trade</button>
        <button id="deleteTrade">Delete Last Trade</button>
    </div>

    <div id="status"></div>

    <hr />

    <h3>Console</h3>
    <pre id="debug" class="debug-box"></pre>

    <script src="popup.js"></script>
</body>
</html>
