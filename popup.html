<!DOCTYPE html>
<html>
<head>
    <title>TradingView Order Bridge</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h2>TradingView Order Bridge</h2>
    <div id="currentSymbol" class="current-symbol">
        Loading symbol...
    </div>
    <!-- Tabs -->
    <div class="tabs">
        <button class="tab active" data-tab="add">Add</button>
        <button class="tab" data-tab="edit">Edit</button>
        <button class="tab" data-tab="delete">Delete</button>
    </div>

    <!-- Tab Content -->
    <div class="tab-content active" id="add">
        <div class="form-fields"></div>
        <button id="addTrade">Add Trade</button>
    </div>

    <div class="tab-content" id="edit">
        <div class="form-fields"></div>
        <button id="editTrade">Edit Trade</button>
    </div>

    <div class="tab-content" id="delete">
        <div class="form-fields"></div>
        <button id="deleteTrade">Delete Trade</button>
    </div>

    <div id="status"></div>

    <hr />

    <h3>Console</h3>
    <pre id="debug" class="debug-box"></pre>

    <script src="popup.js"></script>
</body>
</html>
